# Insider Signal — Scoring Configuration
# This file is the single source of truth for scorer weights.
# Edit weights here to A/B test; no code changes required.
#
# Convention:
#   positive weight = contributes to bullish signal
#   negative weight = contributes to bearish signal (or penalty)
#   enabled: false  = scorer is registered but skipped
#
# A/B testing workflow:
#   1. Duplicate this file to config/scoring_v2.yaml
#   2. Tweak weights
#   3. Run backtest with both configs
#   4. Compare results
#   5. Promote the winner to scoring.yaml

conviction_score:
  weight: 0.30
  enabled: true
  # The dominant signal. Measures how much of the insider's personal
  # position this trade represents. Symmetric in design; the buy/sell
  # asymmetry emerges from routine_penalty + tenb_penalty below.

role_score:
  weight: 0.20
  enabled: true
  # CEO/CFO/COO buying is stronger than director buying.
  # Higher role = more information access = stronger signal.

market_cap_score:
  weight: 0.15
  enabled: true
  # Normalizes trade size by company size.
  # $1M buy in a $300M company >> $1M buy in a $3T company.

cluster_score:
  weight: 0.15
  enabled: true
  # Multiple insiders buying near the same time is stronger than
  # one insider buying. Multiplicative, not additive.

liquidity_score:
  weight: 0.10
  enabled: true
  # Trade size relative to average daily dollar volume.
  # Insider buying 10% of ADV = significant; 0.02% = noise.

technical_score:
  weight: 0.10
  enabled: false  # disabled until backtested against price structure
  # Insider buying during a pullback in an uptrend (close > 200DMA,
  # price 5-20% below 52w high) is a stronger setup than buying
  # at all-time highs. Needs historical price data.

routine_penalty:
  weight: -0.20
  enabled: true
  # Hits insiders who transact in the same calendar months every year
  # (tax sales, scheduled diversification). Zero predictive power.
  # Cohen-Malloy-Pomorski 2012.

tenb_penalty:
  weight: -0.25
  enabled: true
  # Hits trades flagged as 10b5-1 plan executions. Pre-planned trades
  # carry zero information. Form 4 <aff10b5One> checkbox + footnote.
